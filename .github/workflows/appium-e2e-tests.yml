name: Appium E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start Appium Server
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium &
          sleep 10
        
      - name: Build Android Debug APK (Expo)
        run: |
          npx expo prebuild --platform android
          cd android && ./gradlew assembleDebug

      - name: Run Android Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          script: npm run test:android --if-present || true

      - name: Upload Android Results
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: appium-tests/reports/test-results.json
          retention-days: 7

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Export Expo Web Build
        run: npx expo export -p web

      - name: Serve Web Build
        run: |
          npx serve dist &
          sleep 5

      - name: Run Web Appium Tests
        run: npm run test:web --if-present || true

      - name: Upload Web Results
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: appium-tests/reports/test-results.json
          retention-days: 7

  report-generation:
    needs: [android-tests, web-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Download Results
        uses: actions/download-artifact@v4
        with:
          path: appium-tests/reports/
          merge-multiple: true

      - name: Generate Excel Report
        run: node appium-tests/utils/generateExcelReport.js

      - name: Publish Job Summary
        run: |
          echo "## E2E Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Test reports have been generated and attached as artifacts." >> $GITHUB_STEP_SUMMARY
          echo "Download the Excel report below to view full details." >> $GITHUB_STEP_SUMMARY

      - name: Upload Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Test-Report
          path: Vulnerability Test Results/appium-test-report.xlsx
          retention-days: 14
