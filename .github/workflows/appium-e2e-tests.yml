name: Appium E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Appium 3.x and UiAutomator2 Driver
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          appium &
          sleep 10

      - name: Setup Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Debug APK (Expo)
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleDebug
        continue-on-error: true

      - name: Run Android Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          script: npm run test:android --if-present || true
        continue-on-error: true

      - name: Upload Android Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: appium-tests/reports/
          retention-days: 7
          if-no-files-found: warn

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Web Dependencies for Expo
        run: npx expo install react-dom react-native-web @expo/metro-runtime

      - name: Export Expo Web Build
        run: npx expo export -p web
        continue-on-error: true

      - name: Serve Web Build
        run: |
          npx serve dist &
          sleep 5
        continue-on-error: true

      - name: Run Web Tests
        run: npm run test:web --if-present || true
        continue-on-error: true

      - name: Upload Web Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: appium-tests/reports/
          retention-days: 7
          if-no-files-found: warn

  report-generation:
    needs: [android-tests, web-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Download All Test Results
        uses: actions/download-artifact@v4
        with:
          path: appium-tests/reports/
          merge-multiple: true
        continue-on-error: true

      - name: Generate Excel Report
        run: node appium-tests/utils/generateExcelReport.js || echo "No results to report yet"

      - name: Publish Job Summary
        run: |
          echo "## Appium E2E Test Suite - FleetSync PDD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android  | See android-tests job |" >> $GITHUB_STEP_SUMMARY
          echo "| Web      | See web-tests job |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the Appium-Test-Report artifact below to view the full Excel report." >> $GITHUB_STEP_SUMMARY

      - name: Upload Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Test-Report
          path: "Vulnerability Test Results/appium-test-report.xlsx"
          retention-days: 14
          if-no-files-found: warn
